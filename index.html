<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="app-version" content="v__APP_VERSION__">
  <meta name="theme-color" content="#1E7B4F">
  <title>Planillas</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
  <div id="app">
    <header class="appbar">
      <button class="icon-btn" id="btn-files" type="button" aria-label="Mis planillas"><img class="appbar-icon" src="./icon.svg" alt="" width="28" height="28"></button>
      <button class="file-title" id="file-title" type="button" aria-label="Mis planillas (abrir, crear, renombrar, borrar)">Planillas</button>
      <button class="version-chip" id="btn-version" type="button" aria-label="Versión y cambios">v__APP_VERSION__</button>
      <span class="spacer"></span>
      <button class="icon-btn more" id="btn-file-menu" type="button" aria-label="Exportar, importar y más">⋮</button>
    </header>
    <nav class="viewbar" id="viewbar" role="tablist" aria-label="Vista">
      <button class="vb" data-v="tabla" role="tab" type="button" aria-label="Vista Grilla (como Excel)">Grilla</button>
      <button class="vb" data-v="reporte" role="tab" type="button" aria-label="Vista Reporte (tabla presentable)">Reporte</button>
      <button class="vb" data-v="ficha" role="tab" type="button" aria-label="Vista Ficha (un registro por pantalla)">Ficha</button>
    </nav>
    <div class="update-banner" id="update-banner" hidden>
      <span id="update-text">Hay una versión nueva.</span>
      <button class="text-btn" id="update-action" type="button">Recargar</button>
    </div>
    <div class="formula-bar" id="formula-bar">
      <input id="name-box" class="name-box" type="text" value="A1" aria-label="Celda (escribí una referencia, ej. B12, y Enter)" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
      <span class="fx" aria-hidden="true">fx</span>
      <input id="formula" class="formula" type="text" aria-label="Contenido de la celda" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="Tocá una celda y escribí acá">
    </div>
    <main class="grid-wrap" id="grid-wrap" tabindex="0" aria-label="Planilla">
      <table class="grid" id="grid"></table>
    </main>
    <main class="reporte" id="reporte" aria-label="Vista Reporte" hidden>
      <div class="rep-scroll" id="rep-scroll">
        <table class="rep" id="rep-table"></table>
        <p class="rep-empty" id="rep-empty" hidden></p>
      </div>
      <div class="rep-bar">
        <span class="rep-total" id="rep-total"></span>
        <button class="rep-tema" id="rep-tema" type="button" aria-label="Cambiar el tema del reporte (oscuro, claro o el del sistema)"></button>
      </div>
    </main>
    <main class="ficha" id="ficha" aria-label="Vista Ficha" hidden>
      <div class="ficha-head" id="ficha-head"></div>
      <div id="ficha-fields"></div>
      <button class="tool add-field" id="btn-add-field" type="button">+ Campo</button>
    </main>
    <nav class="bottombar" id="grid-bar" aria-label="Acciones">
      <button class="tool" id="btn-add-row" type="button">+ Fila</button>
      <button class="tool" id="btn-add-col" type="button">+ Columna</button>
      <button class="tool" id="btn-clear" type="button">Borrar celda</button>
      <button class="tool" id="btn-more" type="button">Más…</button>
    </nav>
    <nav class="bottombar ficha-bar" id="ficha-bar" aria-label="Registros" hidden>
      <button class="tool" id="f-prev" type="button" aria-label="Registro anterior">◀</button>
      <span class="f-pos" id="f-pos"></span>
      <button class="tool" id="f-next" type="button" aria-label="Registro siguiente">▶</button>
      <button class="tool" id="f-new" type="button">+ Nuevo</button>
      <button class="tool" id="f-del" type="button">Borrar</button>
    </nav>
  </div>

  <section class="files" id="files" aria-label="Mis planillas" hidden>
    <header class="appbar">
      <button class="icon-btn back" id="files-close" type="button" aria-label="Volver">←</button>
      <h1 class="appbar-title">Mis planillas</h1>
      <span class="spacer"></span>
      <button class="view-btn" id="files-import" type="button">Importar</button>
      <button class="view-btn" id="files-new" type="button">+ Nueva</button>
    </header>
    <ul class="file-list" id="file-list"></ul>
    <p class="files-note" id="files-note"></p>
  </section>

  <div id="scrim" class="scrim" hidden></div>
  <div id="menu" class="menu" role="menu" hidden>
    <div class="menu-title" id="menu-title"></div>
    <div id="menu-items"></div>
  </div>
  <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
    <h2 class="dialog-title" id="dialog-title"></h2>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-actions" id="dialog-actions"></div>
  </div>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite"><span id="snack-text"></span><button class="snack-btn" id="snack-btn" type="button" hidden></button></div>

  <!-- WebView o navegador demasiado viejo (por ejemplo, Android 5/6 sin actualizar "Android System WebView"):
       en vez de una pantalla en blanco, se muestra cómo arreglarlo. Escrito en JavaScript viejo (ES5) a propósito. -->
  <script>
  (function () {
    var ok = false;
    try { ok = new Function('class A { static { this.x = 1; } } return [1, 2].at(-1) === 2 && A.x === 1 && typeof Object.hasOwn === "function";')(); } catch (e) { ok = false; }
    if (ok) return;
    var ua = navigator.userAgent, m = /Chrome\/(\d+)/.exec(ua), a = /Android ([\d.]+)/.exec(ua);
    var ver = m ? m[1] : '?';
    var android = !!a;
    var store = 'https://play.google.com/store/apps/details?id=com.google.android.webview';
    document.getElementById('app').style.display = 'none';
    var d = document.createElement('div');
    d.setAttribute('style', 'font-family:sans-serif;max-width:520px;margin:0 auto;padding:32px 24px;line-height:1.5;color:#1F1F1F;background:#FFFFFF;min-height:100vh;box-sizing:border-box');
    d.innerHTML = '<h1 style="font-size:22px;margin:0 0 12px;color:#1E7B4F">Planillas</h1>' +
      (android
        ? '<p>Este equipo tiene una versión vieja de <b>Android System WebView</b> (Chromium ' + ver + ') y la app no puede abrir.</p>' +
          '<p>Actualizala desde Play Store y volvé a abrir Planillas Hace falta la versión <b>94 o más</b> (en Android 5 la última es la 95; en Android 6, la 106).</p>' +
          '<p><a href="' + store + '" style="display:inline-block;padding:10px 20px;border-radius:20px;background:#1E7B4F;color:#fff;text-decoration:none">Abrir en Play Store</a></p>' +
          '<p style="font-size:13px;color:#555">Android ' + a[1] + ' · WebView ' + ver + '</p>'
        : '<p>Este navegador es demasiado viejo para Planillas Actualizalo (o usá Chrome, Edge o Firefox actuales) y volvé a entrar.</p>');
    document.body.appendChild(d);
  })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
